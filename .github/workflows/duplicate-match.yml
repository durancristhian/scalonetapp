name: Saved teams regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scalonet_duplication_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/scalonet_duplication_test
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/scalonet_duplication_test
      DUPLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scalonet_duplication_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:duplicate
      - run: npm run test:duplicate:db
      - run: npm run test:player-teams:state
      - run: npm run test:player-teams:db
